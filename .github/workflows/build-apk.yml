name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install & Sync Capacitor
        run: |
          npm install
          # dist ဖိုင်များ ရှိပြီးသားဆိုလျှင် www သို့ ကူးပြောင်းပေးပြီး sync လုပ်မည် (npm run build ကို ကျော်ခွ၍ path error မတက်စေရန်)
          if [ -d "dist" ]; then
            rm -rf www
            cp -r dist www
          elif [ -d "build" ]; then
            rm -rf www
            cp -r build www
          fi
          npx cap sync

      - name: Build Android APK
        run: |
          mkdir -p gradle/wrapper
          [ -f gradle-wrapper.jar ] && mv gradle-wrapper.jar gradle/wrapper/
          [ -f gradle-wrapper.properties ] && mv gradle-wrapper.properties gradle/wrapper/
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            **/*.apk
