name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install, Fix Vite Base & Build Web
        run: |
          npm install
          # Vite config ထဲတွင် base path ကို ./ သို့ အလိုအလျောက် ပြင်ဆင်ပေးခြင်း (path error လုံးဝမတက်စေရန်)
          node -e '
            const fs = require("fs");
            if (fs.existsSync("vite.config.js")) {
              let content = fs.readFileSync("vite.config.js", "utf8");
              if (!content.includes("base:")) {
                content = content.replace("defineConfig({", "defineConfig({\n  base: \"./\",");
                fs.writeFileSync("vite.config.js", content);
              }
            } else if (fs.existsSync("vite.config.ts")) {
              let content = fs.readFileSync("vite.config.ts", "utf8");
              if (!content.includes("base:")) {
                content = content.replace("defineConfig({", "defineConfig({\n  base: \"./\",");
                fs.writeFileSync("vite.config.ts", content);
              }
            }
          '
          npm run build
          # ထွက်လာသော dist ဖိုင်များကို Capacitor မျှော်လင့်ထားသော www directory သို့ အလိုအလျောက် ပြောင်းရွှေ့ပေးခြင်း
          if [ -d "dist" ]; then
            rm -rf www
            cp -r dist www
          fi
          npx cap sync

      - name: Build Android APK
        run: |
          mkdir -p gradle/wrapper
          [ -f gradle-wrapper.jar ] && mv gradle-wrapper.jar gradle/wrapper/
          [ -f gradle-wrapper.properties ] && mv gradle-wrapper.properties gradle/wrapper/
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            **/*.apk
